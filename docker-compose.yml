services:
  gradle :
    build: .
    image: spring-app
    container_name: gradle_container
    ports:
      - "8081:8080"
    networks:
      - my_network


    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: my_db

    depends_on:
      postgres:
        condition: service_healthy

  postgres :
    image: postgres:18-alpine
    container_name: postgres_container

    environment:
      POSTGRES_DB: my_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5433:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d my_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  rustfs:
    image: rustfs/rustfs
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
volumes:
  postgres_data:

networks:
  my_network: