services:
  gradle :
    build: .
    image: spring-app
    container_name: gradle_container
    ports:
      - "8081:8080"
    networks:
      - my_network

    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: my_db

    depends_on:
      postgres:
        condition: service_healthy

  postgres :
    image: postgres:18-alpine
    container_name: postgres_container

    environment:
      POSTGRES_DB: my_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5433:5432"
    networks:
      - my_network

    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d my_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  postgres-keycloak:
    image: postgres:18-alpine
    container_name: keycloak_pg
    environment:
      POSTGRES_DB: keyclock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d keyclock_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - my_network

  rustfs:
    image: rustfs/rustfs
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"

  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: rabbit_container
    hostname: my-rabbit
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: 12345


  keycloak:
    image: keycloak/keycloak
    container_name: keycloak_container
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      KC_DB: postgres
      KC_BOOTSTRAP_ADMIN_USERNAME: lida
      KC_BOOTSTRAP_ADMIN_PASSWORD: 1234567
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 123456
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keyclock_db
    command:
      - start-dev
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - my_network

volumes:
  postgres_data:

networks:
  my_network: